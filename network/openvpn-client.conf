# OpenVPN client CONF


client
dev tun
proto udp

# 实际的服务器IP地址
remote 140.252.1.92 1194

resolv-retry infinite
nobind
persist-key
persist-tun
mute-replay-warnings
ns-cert-type server
comp-lzo
ca ca.crt 
cert client.crt 
key client.key
tls-auth ta.key 1
cipher AES-256-CBC
verb 3



# 连接VPN
# openvpn --config client.conf
