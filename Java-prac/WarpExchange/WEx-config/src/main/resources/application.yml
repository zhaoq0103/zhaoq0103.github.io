# 配置服务器的端口，通常设置为8888:
server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # 从文件读取配置时，Config Server激活的profile必须设定为native:
    active: native
  cloud:
    config:
      server:
        native:
          # 设置配置文件的搜索路径: 这个搜索路径的当前参考点是什么？ workdir? ==> WEx-config dir ?     ../build/config-repo?   经过测试 workdir 是 WEx-config module 目录
#          search-locations: file:../../build/config-repo, file:./build/config-repo, file:../build/config-repo, file:../../config-repo
          search-locations: file:./build/config-repo